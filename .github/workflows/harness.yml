# Runs the contributor harness self-check. It validates the harness only, not the
# Nihon application; application CI is established by its owning issue (#2).
name: Harness self-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    name: Self-check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Doctor
        run: node tools/harness/harness.mjs doctor
      - name: Run the harness self-check
        run: node tools/harness/harness.mjs run tools/harness/self-check.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-evidence-${{ matrix.os }}
          path: .local/harness/runs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
