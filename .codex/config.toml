# Niihon project configuration: the main task is the orchestrator.
model = "gpt-6-astra"
model_reasoning_effort = "ultra"

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
# Fallback for explicitly selected general delegation.
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "high"
